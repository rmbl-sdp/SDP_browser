name: Deploy prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ENV_DIR: infra/envs/prod

jobs:
  deploy:
    name: Build + push TiTiler, apply Terraform, sync site
    runs-on: ubuntu-latest
    environment: prod  # require reviewer approval in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          ref="${GITHUB_REF##*/}"  # e.g. v0.1.0
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: terraform init

      - name: Read ECR repository URL
        id: ecr_url
        working-directory: ${{ env.ENV_DIR }}
        run: |
          url="$(terraform output -raw ecr_repository_url 2>/dev/null || true)"
          if [ -z "$url" ]; then
            echo "::notice::ECR repo not yet created; applying before first push."
            terraform apply -auto-approve \
              -var "container_image_tag=bootstrap" \
              -target=module.ecr_titiler
            url="$(terraform output -raw ecr_repository_url)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build + push TiTiler image
        uses: docker/build-push-action@v6
        with:
          context: services/titiler
          push: true
          tags: |
            ${{ steps.ecr_url.outputs.url }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr_url.outputs.url }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: terraform apply
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform apply -auto-approve \
            -var "container_image_tag=${{ steps.tag.outputs.tag }}"

      - name: Capture Terraform outputs
        id: tf
        working-directory: ${{ env.ENV_DIR }}
        run: |
          {
            echo "site_bucket=$(terraform output -raw site_bucket_name)"
            echo "site_dist=$(terraform output -raw site_distribution_id)"
            echo "api_dist=$(terraform output -raw api_distribution_id)"
            echo "api_domain=$(terraform output -raw api_distribution_domain)"
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --service "${{ steps.tf.outputs.service }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}"

      - name: Emit runtime config.js
        run: |
          cat > app/web/config.js <<EOF
          // Generated by deploy-prod workflow — do not edit by hand.
          window.__SDP_CONFIG__ = {
            TITILER: "https://${{ steps.tf.outputs.api_domain }}",
            STAC_ROOT: "https://rmbl-sdp.s3.us-east-2.amazonaws.com/stac/v1/catalog.json",
            SITES_QUERY_URL: "https://services8.arcgis.com/jOS5YDdMN6EQxI1b/arcgis/rest/services/ResearchSites_2026_Public_View/FeatureServer/14/query",
          };
          EOF

      - name: Sync static site to S3
        run: |
          aws s3 sync app/web "s3://${{ steps.tf.outputs.site_bucket }}" \
            --delete --exclude "config.example.js"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.site_dist }}" \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.api_dist }}" \
            --paths "/*"
